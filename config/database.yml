# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/usr/local/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  <<: *default
  database: api_crecer_academic_suppor_development
  username: <%= Rails.application.credentials.dig(Rails.env.to_sym, :database_username) %>
  password: <%= Rails.application.credentials.dig(Rails.env.to_sym, :database_password) %>

test:
  <<: *default
  database: api_crecer_academic_suppor_test
  username: <%= Rails.application.credentials.dig(Rails.env.to_sym, :database_username) %>
  password: <%= Rails.application.credentials.dig(Rails.env.to_sym, :database_password) %>

production:
  primary: &primary_production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
    database: api_crecer_academic_suppor_production
    username: api_crecer_academic_suppor
    password: <%= ENV["API_CRECER_ACADEMIC_SUPPOR_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: api_crecer_academic_suppor_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: api_crecer_academic_suppor_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: api_crecer_academic_suppor_production_cable
    migrations_paths: db/cable_migrate
